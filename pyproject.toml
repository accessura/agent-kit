[project]
name = "accessura-agent-kit"
version = "0.8.0"
description = "Accessura Agent Kit — Skill, MCP server, and Python SDK for buyer and seller agents"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "cryptography",
    "eth-account",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["build", "pytest"]

[project.scripts]
accessura-mcp = "server:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["accessura_sdk"]
py-modules = ["catalog_contract", "client_wrapper", "server"]

[project.urls]
Repository = "https://github.com/accessura/agent-kit"
Issues = "https://github.com/accessura/agent-kit/issues"
